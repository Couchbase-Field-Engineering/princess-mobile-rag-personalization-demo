apiVersion: v2
name: royal-app
description: >-
  Royal Caribbean mobile personalization demo on Kubernetes: Couchbase Server
  (guest data from the daily Databricks dump), Sync Gateway (Couchbase Lite
  replication for phones), the backend (FastAPI + the rccl-guest-services MCP
  server, which registers itself with the Couchbase Agent Operations Manager),
  the app in a browser, and a daily CronJob that drops a new mock Databricks
  export.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords: [couchbase, couchbase-lite, sync-gateway, mcp, rag, personalization]
