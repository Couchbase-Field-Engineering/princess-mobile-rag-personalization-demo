# Copies of couchbase-init/init.sh, sync-gateway/db-config.json and
# adobe/generate_mock_export.py (deploy/k8s/deploy.sh refreshes chart/files/
# from the repository before every install).
apiVersion: v1
kind: ConfigMap
metadata:
  name: princess-app-scripts
  labels: {{- include "princess.labels" . | nindent 4 }}
data:
  init.sh: |-
{{ .Files.Get "files/init.sh" | indent 4 }}
  db-config.json: |-
{{ .Files.Get "files/db-config.json" | indent 4 }}
  generate_mock_export.py: |-
{{ .Files.Get "files/generate_mock_export.py" | indent 4 }}
  export.sh: |-
    #!/bin/sh
    # Stands in for the Real-Time CDP dataset export destination: writes today's
    # exportTime= partition if it isn't there yet, then keeps only the newest
    # partitions. Run on first start (init container) and daily (CronJob).
    set -eu
    OUT=/data/adobe-rtcdp-export
    TODAY=$(TZ="${EXPORT_TZ:-UTC}" date +%Y-%m-%d)
    STAMP=$(TZ="${EXPORT_TZ:-UTC}" date +%Y%m%d)
    mkdir -p "$OUT"
    if [ -f "$OUT/exportTime=$STAMP/_SUCCESS" ] && [ "${FORCE:-0}" != "1" ]; then
      echo "Partition exportTime=$STAMP already exported"
    else
      echo "Exporting exportTime=$STAMP ({{ .Values.rtcdpExport.targetMb }} MiB) ..."
      cd /srv && PYTHONPATH=/srv python /scripts/generate_mock_export.py --export-date "$TODAY" \
        --target-mb {{ .Values.rtcdpExport.targetMb }} --parts {{ .Values.rtcdpExport.parts }} --out "$OUT"
    fi
    ls -d "$OUT"/exportTime=* | sort | head -n -{{ .Values.rtcdpExport.keepPartitions }} | while read -r old; do
      echo "Removing $old"; rm -rf "$old"
    done
    ls -la "$OUT"
