{{- $cbPassword := include "princess.secretValue" (dict "root" . "key" "COUCHBASE_PASSWORD" "value" .Values.couchbase.password) -}}
apiVersion: v1
kind: Secret
metadata:
  name: princess-app-secrets
  labels: {{- include "princess.labels" . | nindent 4 }}
  annotations:
    # Generated values must survive `helm uninstall` of a broken upgrade too.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  COUCHBASE_USERNAME: {{ .Values.couchbase.username | quote }}
  COUCHBASE_PASSWORD: {{ $cbPassword | quote }}
  APP_SECRET: {{ include "princess.secretValue" (dict "root" . "key" "APP_SECRET" "value" .Values.backend.appSecret) | quote }}
  AOM_ADMIN_PASSWORD: {{ .Values.aom.adminPassword | quote }}
  AOM_AGENT_API_KEY: {{ .Values.aom.agentApiKey | quote }}
  AOM_UPGRADE_AGENT_API_KEY: {{ .Values.aom.upgradeAgentApiKey | default "" | quote }}
  # Sync Gateway bootstrap config (it holds the Couchbase password).
  sg-bootstrap.json: |
    {
      "bootstrap": {
        "server": "couchbase://couchbase",
        "username": {{ .Values.couchbase.username | quote }},
        "password": {{ $cbPassword | quote }},
        "use_tls_server": false
      },
      "api": {
        "public_interface": ":4984",
        "admin_interface": ":4985",
        "metrics_interface": ":4986",
        "admin_interface_authentication": true
      },
      "logging": { "console": { "log_level": "info", "log_keys": ["HTTP", "Sync", "Import", "CRUD"] } }
    }
