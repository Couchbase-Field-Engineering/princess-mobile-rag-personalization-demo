# princess-app on "mother" (single-node K3s, managed by Rancher) at 192.168.111.4.
# Secrets (the AOM admin password) are NOT kept here - deploy.sh writes them to
# a mode-600 values file on mother instead.
publicHost: "192.168.111.4"
# mother has no working LoadBalancer (ServiceLB), so publish on the node IP directly.
externalIPs: ["192.168.111.4"]

aom:
  enabled: true
  # The AOM this demo registers with. Two are reachable from mother:
  #   - the in-cluster agent-ops release:  https://aom-operations-manager.agent-ops.svc.cluster.local:8090
  #     (dashboard https://192.168.111.4:3111; AOM reaches the MCP server in-cluster, leave mcpPublicUrl blank)
  #   - the AOM behind the public IP (the NOV procurement demo's), whose dashboard proxies the API:
  #     https://45.52.200.223:3111. It is outside the cluster, so it reaches this demo's MCP server
  #     through the published backend port on the node.
  # Nov 2026: the in-cluster AOM (dashboard https://192.168.111.4:3111), so the fleet
  # chatbot workload (scripts/run_chatbot_workload.py) lands on that dashboard. The
  # registration bootstrap handles the switch: the key kept in Couchbase fails on the
  # new AOM, so both agent identities are issued fresh there.
  url: https://aom-operations-manager.agent-ops.svc.cluster.local:8090
  # Blank = AOM reaches the MCP server in-cluster (backend.princess-app.svc.cluster.local:8200).
  mcpPublicUrl: ""
  # Linked from the story page.
  dashboardUrl: https://192.168.111.4:3111

# K3s's ServiceLB (Klipper) binds each LoadBalancer port on the node's IP.
# The Royal Caribbean demo (release royal-app) already holds 8081 / 8200 / 4984
# on mother, so this demo publishes one port up from each:
#   8082 the app, 8201 the backend API, 4986 Sync Gateway (Couchbase Lite).
# AOM's dashboard is on 3111 (agent-ops chart, values-k3s.yaml).
web:
  service: { type: LoadBalancer, port: 8082 }
backend:
  service: { type: LoadBalancer, port: 8201 }
syncGateway:
  service: { type: LoadBalancer, port: 4986 }
