server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 5m;

  # The web build calls the backend on its own origin (EXPO_PUBLIC_API_URL=same-origin),
  # so one URL serves the app in Docker Compose and in Kubernetes. `backend` is the
  # compose service name and the Kubernetes Service name.
  location /api/ {
    proxy_pass http://backend:8200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # The story that opens the demo (Couchbase vs Redis for an offline-first AI guest app).
  location = /story {
    try_files /story.html =404;
  }

  # expo-router routes (/login, /upgrade, ...) are client-side: fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
