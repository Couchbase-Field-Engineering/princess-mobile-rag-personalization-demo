# Royal Caribbean mobile personalization demo
#
#   couchbase       Couchbase Server Enterprise 8.0.2 (developer/free license for dev & test)
#   couchbase-init  one-shot: bucket `royal`, scope `rccl`, collections, indexes
#   sync-gateway    Sync Gateway 4.0 Enterprise (required by Couchbase Lite 4.x) - replicates to Couchbase Lite on the phone
#   sg-init         one-shot: creates the `royal` SG database (sync functions per collection)
#   backend         FastAPI + the `rccl-guest-services` MCP server, the daily-dump loader
#                   and the offline-first request worker  (http://localhost:8200)
#   web             the app in a browser                  (http://localhost:8081)
#
# The Couchbase Agent Operations Manager runs as its own compose stack on the same
# machine; the backend reaches it at https://host.docker.internal:8090 and AOM reaches
# the backend's MCP server at http://host.docker.internal:8200/rccl/mcp.
# Host ports are chosen to avoid AOM (8090, 8091-8096) and the NOV demo (9091/9093, 4000, 8080).

services:
  couchbase:
    image: couchbase:enterprise-8.0.2
    container_name: rccl-couchbase
    restart: unless-stopped
    ports:
      - "127.0.0.1:18091:8091"   # Web Console: http://localhost:18091 (Administrator / password123)
    volumes:
      - couchbase-data:/opt/couchbase/var
    healthcheck:
      # No -f: this Couchbase version answers /pools with 401 as soon as it is up.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8091/pools"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 40

  couchbase-init:
    image: couchbase:enterprise-8.0.2
    container_name: rccl-couchbase-init
    depends_on:
      couchbase:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/init.sh"]
    environment:
      CB_HOST: couchbase
      CB_USERNAME: Administrator
      CB_PASSWORD: password123
    volumes:
      - ./couchbase-init:/init:ro
    restart: "no"

  sync-gateway:
    image: couchbase/sync-gateway:4.0.4-enterprise
    container_name: rccl-sync-gateway
    restart: unless-stopped
    depends_on:
      couchbase-init:
        condition: service_completed_successfully
    command: ["/etc/sync_gateway/sg-bootstrap.json"]
    volumes:
      - ./sync-gateway/sg-bootstrap.json:/etc/sync_gateway/sg-bootstrap.json:ro
    ports:
      - "4984:4984"              # public REST / replication: ws://<your-mac-ip>:4984/royal
      - "127.0.0.1:4985:4985"    # admin API - localhost only

  sg-init:
    image: curlimages/curl:8.11.1
    container_name: rccl-sg-init
    depends_on:
      - sync-gateway
    entrypoint: ["/bin/sh", "/sg/sg-init.sh"]
    environment:
      SG_ADMIN_URL: http://sync-gateway:4985
    volumes:
      - ./sync-gateway:/sg:ro
    restart: "no"

  backend:
    build: ./backend
    container_name: rccl-backend
    restart: unless-stopped
    depends_on:
      couchbase-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      STORE_DRIVER: couchbase
      COUCHBASE_CONN: couchbase://couchbase
      COUCHBASE_USERNAME: Administrator
      COUCHBASE_PASSWORD: password123
      DUMP_DIR: /data/databricks-dump
      SG_ADMIN_URL: http://sync-gateway:4985
      SG_ADMIN_USERNAME: Administrator
      SG_ADMIN_PASSWORD: password123
    volumes:
      - ./data:/data:ro
    ports:
      - "8200:8200"              # app API + MCP server (/rccl/mcp)

  web:
    # The app in a browser: http://localhost:8081 (sign in with a demo guest).
    # Same screens and documents as the device build; uses the preview sync
    # engine instead of Couchbase Lite. Rebuild after app changes:
    #   cd mobile && npm run export:web:docker && docker compose up -d --build web
    build: ./web
    container_name: rccl-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  couchbase-data:
